<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="assets/css/index.css" />
    <script src="assets/js/index.js" defer></script>
  </head>
  <body>
    <main>
      <div class="main-header">
        <img
          src="ironpulse-exam-assets/brand/ironpulse-header-wordmark.png"
          alt=""
        />
        <nav class="navbar">
          <a href="">plans</a>
          <a href="">classes</a>
          <a href="">Trainers</a>
          <a href="">Contact</a>
        </nav>
        <div class="image">
          <img src="ironpulse-exam-assets/icons/moon.svg" alt="" />
          <img src="ironpulse-exam-assets/icons/sun.svg" alt="" />
        </div>

        <button class="btn">Join now</button>
        <div class="burger">
          <img src="harmburger.jpg" alt="" />
        </div>
      </div>

      <div class="pick">
        <div class="plan">
          <h1>pick the plan that moves you</h1>
          <p>find the right rhythm, support and space to reach your goals.</p>
          <button class="btn2">Find My Plan</button>
          <button class="btn3">View All Plans.</button>
        </div>
        <img src="ironpulse-exam-assets/images/hero-athlete.png" alt="" />
      </div>

      <div class="pace">
        <h1>Plans for every pace</h1>
        <div class="button">
          <button class="btn4">Monthly</button>
          <button class="year">yearly</button>
          <button class="btn5">save 20%</button>
        </div>
      </div>

      <div class="starter">
        <div class="pro">
          <h3>Starter</h3>
          <h1>$24span /month</h1>
          <p>Agreater start for building healthy habits.</p>
          <div class="gym">
            <img src="ironpulse-exam-assets/icons/check.svg" alt="" />
            <p>Gym access 6am-10pm</p>
          </div>
          <div class="gym">
            <img src="ironpulse-exam-assets/icons/check.svg" alt="" />
            <p>2 group classes weekly</p>
          </div>
          <div class="gym">
            <img src="ironpulse-exam-assets/icons/check.svg" alt="" />
            <p>Locker access</p>
          </div>
          <div class="gym">
            <img src="ironpulse-exam-assets/icons/check.svg" alt="" />
            <p>Workout app</p>
          </div>
          <button class="tar">Choose Starter</button>
        </div>
      </div>
    </main>
  </body>
</html>
